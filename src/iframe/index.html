<!doctype html>
<html lang="zh-Hans">
	<head>
		<!--
			title 标签仅作兜底：EDA 决定窗口标题的优先级是
			openIFrame 的 props.title > 本标签（见 ui.js）。
			实际标题由 import-dwg.ts 用 sys_I18n.text() 翻译后经 props.title 传入，
			故此处固定写英文，不作为多语言入口。
		-->
		<title>Import DWG</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!--
			DWG 解析引擎（@mlightcad/libredwg-web）的运行时资源。

			为什么用 <link> 声明，而不是在 JS 里 import：
			EDA 在渲染弹窗时会扫描 HTML/CSS 中形如 src|href="/xxx" 的**包内绝对路径**，
			逐个取文件内容并替换为 blob URL（见 ui.js 的 changeLabelAddress）。
			但 JS 内部的 import() / fetch() **不会**被这样处理，
			而 iframe 页面本身是 blob URL，用相对路径解析会抛 Invalid URL。

			因此这里用 rel="preload"（浏览器只预载、不执行）把资源"登记"进 DOM，
			使 EDA 完成 blob URL 改写；运行时再由 dwg/resources.ts 取回使用：

			  vendor-libredwg      → 合并后的自包含 ESM（由 sync-vendor.mjs 生成）
			  vendor-libredwg-wasm → wasm 二进制，其 URL 经 locateFile 传给引擎

			注意：引擎文件必须是**无相对 import** 的自包含模块 ——
			上游原始产物内部用 `import "../wasm/..."` 引用胶水层，
			在 blob 下会因无法解析相对路径而失败（故 sync-vendor.mjs 做了合并）。
		-->
		<link rel="preload" as="script" id="vendor-libredwg" href="/dist/vendor/libredwg-web/libredwg-web.js" />
		<link rel="preload" as="fetch" id="vendor-libredwg-wasm" href="/dist/vendor/libredwg-web/libredwg-web.wasm" />
	</head>
	<body>
		<div id="app" class="app">
			<!--
				左右两栏布局：
				  左栏 = 文件选择（拖拽区）+ 图层映射（图层较多，仅此区域内部滚动）
				  右栏 = 文件状态条（名称/大小/解析状态）+ 选项（固定宽度）
				底部 footer 由 .app 的纵向 flex 固定在底部，不随内容滚动。
				整体不出现页面级滚动条（body overflow: hidden）。
			-->
			<main data-role="main" class="app-main">
				<div class="col col-left">
					<section data-role="file-section" class="card">
						<div data-role="dropzone" class="dropzone"></div>
						<input data-role="file-input" type="file" accept=".dwg" hidden />
					</section>

					<section data-role="layer-mapping-section" class="card card-grow">
						<div data-role="toolbar" class="toolbar">
							<button data-role="select-all" class="btn"></button>
							<button data-role="deselect-all" class="btn"></button>
							<button data-role="by-color" class="btn"></button>
							<button data-role="by-name" class="btn"></button>
							<button data-role="reset" class="btn"></button>
						</div>
						<div class="table-wrap">
							<table class="mapping-table">
								<thead>
									<tr>
										<th></th>
										<th data-role="col-dwg">DWG</th>
										<th>✓</th>
										<th data-role="col-pcb"></th>
									</tr>
								</thead>
								<tbody data-role="rows"></tbody>
							</table>
						</div>
					</section>
				</div>

				<div class="col col-right">
					<section data-role="file-status-section" class="card file-status-card">
						<div data-role="file-name" class="file-name"></div>
						<div data-role="status" class="status-line"></div>
						<div data-role="file-size" class="status-line"></div>
					</section>

					<section data-role="options-section" class="card card-grow">
						<div data-role="title" class="card-title"></div>
						<div class="options-row">
							<span data-role="width-label"></span>
							<select data-role="width-select"></select>
						</div>
						<div class="options-row">
							<span data-role="unit-label"></span>
							<select data-role="unit-select"></select>
						</div>
						<div data-role="offset-label" class="sub-label"></div>
						<div class="options-row offset-row">
							<!--
								X/Y 轴名直接写在 HTML：与表头 DWG、此前的逗号分隔符同类，
								属通用符号（中英文一致），无需进语言包。
								原来只有逗号分隔，两个数字框分不清哪个是 X 哪个是 Y。
								每组用 label 包住：组内间隙 6px（.options-row label 规则），
								与组间 8px 拉开对比，轴名归属一目了然；点轴名即可聚焦输入框。
							-->
							<label class="axis-field">
								<span class="axis-label">X</span>
								<input data-role="offset-x" class="num-input" type="number" step="any" />
							</label>
							<label class="axis-field">
								<span class="axis-label">Y</span>
								<input data-role="offset-y" class="num-input" type="number" step="any" />
							</label>
							<button data-role="pick-origin" class="icon-btn" type="button"></button>
						</div>
						<div class="options-row">
							<label>
								<input data-role="skip-empty" type="checkbox" />
								<span data-role="skip-empty-label"></span>
							</label>
						</div>
						<div class="options-row">
							<label class="is-disabled">
								<input type="checkbox" disabled />
								<span data-role="merge-collinear-label"></span>
							</label>
						</div>
						<!--
							实体类型开关放在选项卡片底部（CSS margin-top:auto 推到底边）：
							日常导入很少逐类勾选，放底部不挡常用项（线宽/单位/原点偏移）。
						-->
						<div data-role="kind-label" class="sub-label"></div>
						<div data-role="kind-grid" class="kind-grid"></div>
					</section>
				</div>
			</main>

			<footer data-role="footer" class="app-footer">
				<button data-role="cancel-btn" class="btn"></button>
				<button data-role="import-btn" class="btn btn-primary" disabled></button>
			</footer>
		</div>

		<!--
			脚本放在 body 末尾：确保 #app 已存在再执行。
			不要移到文档头部：EDA 通过 blob URL 注入本页面，defer 语义在此场景下不可靠，
			放在文档头部会导致 document.getElementById('app') 为 null。

			路径必须是扩展包内绝对路径（以 / 开头），前缀与 openIFrame 的 htmlFileName 一致。
		-->
		<script type="module" src="/dist/iframe/index.js"></script>
	</body>
</html>
